<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Webpage</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 {
            color: #0066cc;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Demo Page</h1>
        <p>A simple, clean index.html template starter kit.</p>
    </header>

    <main class="card">
        <h2>Interactive Elements</h2>
        <p>This is a foundational HTML5 boilerplate boilerplate that incorporates embedded styling (CSS) and interactivity (JavaScript).</p>
        
        <button id="demoBtn">Click Me!</button>
        <p id="message" style="margin-top: 15px; font-weight: bold; color: #2e7d32;"></p>
    </main>

    <script>
        const button = document.getElementById('demoBtn');
        const message = document.getElementById('message');

        button.addEventListener('click', () => {
            message.textContent = '🎉 Hello! The JavaScript functionality is working perfectly.';
        });
    </script>

</body>
</html>
